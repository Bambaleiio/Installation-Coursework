<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Input</title>
    <style>
        :root {
            --primary: #9b59b6;
            --secondary: #8e44ad;
            --background: #2c3e50;
            --text: #ecf0f1;
            --border: #34495e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            color: var(--text);
            min-height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, var(--background), var(--primary));
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 80%;
            max-width: 400px;
            padding: 2rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .slider {
            width: 100%;
            height: 15px;
            border-radius: 10px;
            background: var(--border);
            outline: none;
            -webkit-appearance: none;
            margin: 1rem 0;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .slider::-moz-range-thumb {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .button {
            width: 100%;
            padding: 12px 24px;
            background: var(--primary);
            border: none;
            border-radius: 5px;
            color: var(--text);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .button:hover {
            background: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .button:active {
            transform: translateY(0);
        }

        .text-input {
            width: 100%;
            padding: 12px 20px;
            margin: 1rem 0;
            background: var(--border);
            border: 2px solid var(--border);
            border-radius: 5px;
            color: var(--text);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .text-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(155, 89, 182, 0.3);
        }

        .text-input::placeholder {
            color: var(--text);
            opacity: 0.7;
        }

        h1 {
            font-size: 60px;
            margin: 0 0;
            color: var(--text);
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Input test</h1>
        <input type="range" min="0" max="100" value="50" class="slider" id="mySlider">
        <input type="text" class="text-input" id="myInput" placeholder="Enter text...">
        <button class="button" id="myButton">Action</button>
    </div>
</body>
</html>
